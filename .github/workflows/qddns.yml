name: Build luci-app-qddns Multi-Arch 

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "qualcommax-ipq60xx"
            arch: "qualcommax-ipq60xx"
            tag: "snapshot"
          - name: "mediatek-filogic-23.05.0"
            arch: "mediatek-filogic"
            tag: "23.05.0"

    name: Build luci-app-qddns (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 自动寻找 Cargo.toml 并完成交叉编译
      - name: Pre-compile Rust Binaries on Host
        run: |
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          
          # 智能寻找包含 Cargo.toml 的目录
          CARGO_DIR=$(find . -name "Cargo.toml" -exec dirname {} \; | head -n 1)
          if [ -z "$CARGO_DIR" ]; then
            echo "错误: 未在仓库中找到 Cargo.toml 文件！"
            exit 1
          fi
          
          echo "寻找到 Rust 项目路径: $CARGO_DIR"
          cd "$CARGO_DIR"
          
          cargo build --release --target=aarch64-unknown-linux-musl
          
          # 创建临时目录存放编译好的静态二进制
          mkdir -p "$GITHUB_WORKSPACE/prebuilt-bin"
          cp target/aarch64-unknown-linux-musl/release/qddnsctl "$GITHUB_WORKSPACE/prebuilt-bin/"
          cp target/aarch64-unknown-linux-musl/release/qddnsd "$GITHUB_WORKSPACE/prebuilt-bin/"
          
          cargo clean

      # 将预编译好的二进制文件注入到 OpenWrt 编译树中
      - name: Inject Prebuilt Binaries
        run: |
          mkdir -p net/qddns/bin
          cp prebuilt-bin/qddnsctl net/qddns/bin/
          cp prebuilt-bin/qddnsd net/qddns/bin/
          chmod +x net/qddns/bin/*

      # 呼叫官方 SDK 容器进行纯打包操作
      - name: Build Packages using gh-action-sdk
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.tag }}
          FEEDNAME: luci_app_qddns

      - name: Copy packages to staging
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          find bin/packages/ -type f \( \
            -name "qddns*.ipk" -o \
            -name "qddns*.apk" -o \
            -name "luci-app-qddns*.ipk" -o \
            -name "luci-i18n-qddns*.ipk" -o \
            -name "luci-app-qddns*.apk" -o \
            -name "luci-i18n-qddns*.apk" \
          \) -exec cp -v {} packages-staging/${{ matrix.name }}/ \;

      - name: Upload packages to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 1
          if-no-files-found: warn

  publish-release:
    needs: build-multi-arch
    runs-on: ubuntu-latest
    name: Publish to GitHub Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R release-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-qddns"
          name: "luci-app-qddns Multi-Arch Release"
          draft: false
          prerelease: false
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
