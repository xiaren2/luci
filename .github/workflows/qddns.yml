name: Build luci-app-qddns Multi-Arch 

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "qualcommax-ipq60xx-snapshot"
            sdk_url: "https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq60xx/openwrt-sdk-qualcommax-ipq60xx_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            extract_cmd: "tar -I zstd -xf"
            rust_target: "aarch64-unknown-linux-musl"
          - name: "mediatek-filogic-23.05.0"
            sdk_url: "https://downloads.openwrt.org/releases/23.05.0/targets/mediatek/filogic/openwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
            extract_cmd: "tar -xJf"
            rust_target: "aarch64-unknown-linux-musl"

    name: Build luci-app-qddns (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache fastjar file g++ gawk gettext git libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync unzip wget zlib1g-dev xz-utils zstd

      # 核心修复点：初始化系统 Rust 工具链环境，防止 rustup 找不到默认配置
      - name: Initialize Rust Environment
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Download and Extract OpenWrt SDK
        run: |
          wget ${{ matrix.sdk_url }} -O sdk-archive
          mkdir openwrt-sdk-tmp
          ${{ matrix.extract_cmd }} sdk-archive -C openwrt-sdk-tmp
          mv openwrt-sdk-tmp/* openwrt-sdk
          rm -rf openwrt-sdk-tmp sdk-archive

      - name: Prepare package
        run: |
          mkdir -p openwrt-sdk/package/luci-app-qddns
          rsync -av --delete \
            --exclude 'openwrt-sdk' \
            --exclude '.git' \
            --exclude 'bin' \
            --exclude '.github' \
            --exclude '*.tar.*' \
            . openwrt-sdk/package/luci-app-qddns/

      - name: Build package
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          
          # 清理可能导致冲突的硬编码目录变量，交由全局管理
          unset CARGO_HOME
          unset RUSTUP_HOME
          
          # 把标准的构建目标通过参数透传进去
          make package/luci-app-qddns/compile V=s CONFIG_AUTOREBUILD=y TARGET_CROSS=${{ matrix.rust_target }}-

      - name: Copy packages to staging
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          find openwrt-sdk/bin/ -type f \( \
            -name "qddns*.ipk" -o \
            -name "qddns*.apk" -o \
            -name "luci-app-qddns*.ipk" -o \
            -name "luci-i18n-qddns*.ipk" -o \
            -name "luci-app-qddns*.apk" -o \
            -name "luci-i18n-qddns*.apk" \
          \) -exec cp -v {} packages-staging/${{ matrix.name }}/ \;

      - name: Upload packages to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 1
          if-no-files-found: warn

  publish-release:
    needs: build-multi-arch
    runs-on: ubuntu-latest
    name: Publish to GitHub Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R release-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-qddns"
          name: "luci-app-qddns Multi-Arch Release"
          draft: false
          prerelease: false
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
