name: Build luci-app-qddns Multi-Arch 

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-multi-arch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "qualcommax-ipq60xx"
            arch: "qualcommax-ipq60xx"
            tag: "snapshot"  # 使用官方最新的 snapshot SDK 容器
          - name: "mediatek-filogic-23.05.0"
            arch: "mediatek-filogic"
            tag: "23.05.0"   # 使用纯净的 23.05.0 SDK 容器

    name: Build luci-app-qddns (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 核心修复点：初始化系统级原生 Rust 工具链，给后面的 cargo 交叉编译备用
      - name: Initialize System Rust Environment
        run: |
          rustup default stable
          rustup target add aarch64-unknown-linux-musl

      # 降维打击：直接调用官方/主流 SDK Action
      # 它会自己搞定容器、依赖隔离，绝不会去原地编译或者污染 libnl-tiny 等系统库
      - name: Build Packages using gh-action-sdk
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.tag }}
          FEEDNAME: luci_app_qddns
          # 告诉 SDK，我们的系统环境里有 cargo 交叉编译链，编译时直接用它
          TARGET_CROSS: aarch64-unknown-linux-musl-

      - name: Copy packages to staging
        shell: bash
        run: |
          shopt -s globstar
          mkdir -p packages-staging/${{ matrix.name }}
          # gh-action-sdk 编译出来的产物统一会放在 bin/packages/ 架构目录下
          find bin/packages/ -type f \( \
            -name "qddns*.ipk" -o \
            -name "qddns*.apk" -o \
            -name "luci-app-qddns*.ipk" -o \
            -name "luci-i18n-qddns*.ipk" -o \
            -name "luci-app-qddns*.apk" -o \
            -name "luci-i18n-qddns*.apk" \
          \) -exec cp -v {} packages-staging/${{ matrix.name }}/ \;

      - name: Upload packages to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: packages-staging/${{ matrix.name }}/
          retention-days: 1
          if-no-files-found: warn

  publish-release:
    needs: build-multi-arch
    runs-on: ubuntu-latest
    name: Publish to GitHub Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R release-packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "luci-app-qddns"
          name: "luci-app-qddns Multi-Arch Release"
          draft: false
          prerelease: false
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
