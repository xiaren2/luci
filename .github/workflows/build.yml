name: Build OpenWrt Packages

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-wechatpush
  SDK_DIR: /home/runner/work/openwrt-sdk

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (v25.12)
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: 'v25.12.0-rc1'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: all
            path: x86/64

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip zstd python3-pyelftools

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-apk-${{ matrix.target.name }}-${{ env.OPENWRT_VERSION }}

      - name: Download and prepare OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url="https://downloads.openwrt.org/releases/${release_version}/targets/${{ matrix.target.path }}"
          sdk_file=$(curl -s "$sdk_url/" | grep -o 'openwrt-sdk-[^"]*\.tar\.(xz|zst)' | head -n1)

          wget -q "$sdk_url/$sdk_file"
          tar -xf "$sdk_file"
          mv openwrt-sdk-* ${{ env.SDK_DIR }}

          cd ${{ env.SDK_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package source
        working-directory: ${{ env.SDK_DIR }}
        run: |
          pkg_src="${{ github.workspace }}/luci-app-wechatpush-master"

          if [ ! -f "$pkg_src/Makefile" ]; then
            echo "::error::Makefile not found in $pkg_src"
            exit 1
          fi

          rm -rf package/${PACKAGE_NAME}
          mkdir -p package/${PACKAGE_NAME}
          rsync -a --delete "$pkg_src"/ package/${PACKAGE_NAME}/

          translation_pkg=${PACKAGE_NAME#luci-app-}

          cat <<EOF > .config
          CONFIG_PACKAGE_${PACKAGE_NAME}=m
          CONFIG_PACKAGE_luci-i18n-${translation_pkg}-zh-cn=m
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF

          make defconfig

      - name: Compile package
        working-directory: ${{ env.SDK_DIR }}
        run: make package/${PACKAGE_NAME}/compile V=s -j$(nproc)

      - name: Collect APKs
        id: collect
        working-directory: ${{ env.SDK_DIR }}
        run: |
          mkdir -p upload
          find bin -name '*.apk' -exec cp {} upload/ \;
          echo "path=upload" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-apk
          path: ${{ env.SDK_DIR }}/${{ steps.collect.outputs.path }}

  build-ipk:
    name: Build IPK (v23.05)
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: 'v23.05.3'

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip zstd

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-ipk-${{ env.OPENWRT_VERSION }}

      - name: Download and prepare OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url="https://downloads.openwrt.org/releases/${release_version}/targets/x86/64"
          sdk_file=$(curl -s "$sdk_url/" | grep -o 'openwrt-sdk-[^"]*\.tar\.(xz|zst)' | head -n1)

          wget -q "$sdk_url/$sdk_file"
          tar -xf "$sdk_file"
          mv openwrt-sdk-* ${{ env.SDK_DIR }}

          cd ${{ env.SDK_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package source
        working-directory: ${{ env.SDK_DIR }}
        run: |
          pkg_src="${{ github.workspace }}/luci-app-wechatpush-master"

          if [ ! -f "$pkg_src/Makefile" ]; then
            echo "::error::Makefile not found in $pkg_src"
            exit 1
          fi

          rm -rf package/${PACKAGE_NAME}
          mkdir -p package/${PACKAGE_NAME}
          rsync -a --delete "$pkg_src"/ package/${PACKAGE_NAME}/

          translation_pkg=${PACKAGE_NAME#luci-app-}

          cat <<EOF > .config
          CONFIG_PACKAGE_${PACKAGE_NAME}=m
          CONFIG_PACKAGE_luci-i18n-${translation_pkg}-zh-cn=m
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF

          make defconfig

      - name: Compile package
        working-directory: ${{ env.SDK_DIR }}
        run: make package/${PACKAGE_NAME}/compile V=s -j$(nproc)

      - name: Collect IPKs
        id: collect
        working-directory: ${{ env.SDK_DIR }}
        run: |
          mkdir -p upload
          find bin -name '*.ipk' -exec cp {} upload/ \;
          echo "path=upload" >> $GITHUB_OUTPUT

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-ipk
          path: ${{ env.SDK_DIR }}/${{ steps.collect.outputs.path }}

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-ipk]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**/*
